name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main", "feature/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Upload Vendor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-directory
          path: vendor/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Vendor Artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor-directory
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run Tests
        run: php artisan test

  staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging server..."
          echo "Staging deployment successful!"

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Simulated Production Deployment
        run: |
          echo "Step 1: Turn on maintenance mode (php artisan down)"
          echo "Step 2: Pull the latest changes (git pull origin main)"
          echo "Step 3: Install dependencies (composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev)"
          echo "Step 4: Run database migrations (php artisan migrate --force)"
          echo "Step 5: Clear and cache routes/config (php artisan optimize)"
          echo "Step 6: Restart queues (php artisan queue:restart)"
          echo "Step 7: Turn off maintenance mode (php artisan up)"
